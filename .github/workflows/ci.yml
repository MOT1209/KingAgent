# Continuous integration: install, validate, test.
#
# Two jobs, one per platform the app ships on. Both run the same gate (npm
# test), because a suite that only passes on the machine that wrote it is not
# a gate �?? the Windows job exists precisely because 100+ tests assumed POSIX
# paths and nobody noticed until someone tried to port.
#
# The lint and coverage gates run once, on Linux, so a style regression or a
# slip under the coverage floor costs one job, not three.
#
# Releases stay in release.yml: tag a v* and the release workflow builds,
# signs and publishes. This file never publishes.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The zsh-backed run-done tests are part of the gate, and a bare Ubuntu
      # image ships no shell to run them on, so install the one they need.
      # (macOS and Windows runners ship zsh/PowerShell already.)
      - name: Install zsh
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Syntax-check every main-process module
        run: node scripts/check-syntax.mjs

      # The gate. Windows runs the same suite as Linux; tests that touch real
      # OS features (symlinks) declare their needs and skip where the OS or
      # the session cannot grant them.
      - run: npm test

      # Coverage floor (c8 thresholds in package.json). The suite already ran
      # above; this re-runs it under instrumentation once, so a drop under the
      # floor fails rather than publishing quietly. Linux only �?? it is the
      # same source on every OS, and instrumentation is the expensive part.
      - name: Coverage floor
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      # eslint over the whole repo: every file, not just the ones a diff touched.
      - name: Lint
        run: npm run lint

  # A Windows packaging dry-run: prove the electron-builder config parses and
  # an unpacked Windows build assembles on a real Windows runner, without
  # publishing anything. Slow, so it runs only on main.
  pack-win:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Whisper weights (~44 MB) are gitignored and fetched at package time;
      # the cache makes the second run cheap.
      - name: Cache Whisper weights
        uses: actions/cache@v4
        with:
          path: build/models
          key: whisper-${{ runner.os }}-${{ hashFiles('scripts/fetch-model.mjs', 'src/main/stt-model.js') }}

      - run: npm run pack:win
        env:
          # dir output only; no codesigning, no publish.
          EP_DRAFT: "false"

      - name: Verify the unpacked build
        shell: pwsh
        run: |
          $exe = Get-ChildItem "release/win-unpacked/KingAgent.exe" -ErrorAction SilentlyContinue
          if (-not $exe) { Write-Error "no win-unpacked/KingAgent.exe produced"; exit 1 }
          Write-Host "win-unpacked build present:" $exe.FullName
          # Native modules must be unpacked beside the app, not inside asar.
          $pty = Get-ChildItem "release/win-unpacked/resources/app.asar.unpacked/node_modules/@lydell/node-pty" -ErrorAction SilentlyContinue
          if (-not $pty) { Write-Error "node-pty missing from asar.unpacked"; exit 1 }
          # The on-device Whisper weights must be in the bundle. An empty
          # build/models is not a build failure — electron-builder copies
          # nothing and the app silently downloads on first launch, which is
          # exactly what the local engine exists to avoid. Checked here because
          # only the packed output can answer it.
          $onnx = Get-ChildItem "release/win-unpacked/resources/models" -Recurse -Filter *.onnx -ErrorAction SilentlyContinue
          if (-not $onnx) { Write-Error "no Whisper weights in resources/models — this build cannot transcribe offline"; exit 1 }
          Write-Host "offline model present:" ($onnx | ForEach-Object { $_.Name }) -join ', '
