name: ship

# A rolling release on every push to main, so the last thing anyone pushed is
# always downloadable and installed copies of KingAgent can update to it.
#
# Jobs:
#
#   prepare  computes the next version as latest-published-patch + 1 and stops
#            there — nothing is committed or pushed back. (Committing the bump
#            first seemed obvious, but the build jobs check out the *triggering*
#            sha, not the bump commit, so the built feed always carried the old
#            version while the tag carried the new one, and no updater ever
#            fired.) Every build is handed the version explicitly:
#            electron-builder -c.extraMetadata.version=$VERSION writes it into
#            the app's package.json and the latest*.yml it emits, so what the
#            tag names is exactly what the updater reads. A plain dotted
#            version, because the built-in updater compares latest.yml with
#            semver and update-check.js compares three parts, and a prerelease
#            suffix would be ordered by neither.
#
#   build    the installers, one job per platform so Windows and macOS build in
#            parallel. `publish never` keeps the step honest; uploading is
#            publish's job, after the update metadata has been corrected.
#            Unsigned for now: no Apple credentials are wired up, so the macOS
#            builds are downloadable but Gatekeeper has things to say, and
#            Squirrel.Mac will not swap an unsigned app — the bar still offers
#            the dmg.
#
#   publish  releases whatever landed as a non-prerelease release under the
#            computed tag, after verifying the metadata it ships actually names
#            that version. Non-prerelease matters twice: GitHub's
#            releases/latest only points at the newest non-prerelease, and
#            electron-updater reads its feed from releases/latest. It runs even
#            when a platform job failed (always()), so Windows and macOS each
#            ship the moment their own job succeeds.
#
# The manual release.yml flow for signed, tagged stable builds is untouched and
# coexists: ship only ever makes v<dotted> tags one patch above the newest one
# that exists, tags nothing else, and a stable tag (or draft) can land between
# rollings without a fight.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute the next version
        id: version
        run: |
          LATEST=$(gh api repos/MOT1209/KingAgent/releases/latest --jq '.tag_name' 2>/dev/null || true)
          BASE=$(node -p "require('./package.json').version")
          if [ -n "$LATEST" ] && [[ "$LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            BASE=${LATEST#v}
          fi
          IFS=. read -r MAJ MIN PAT <<< "$BASE"
          VERSION="$MAJ.$MIN.$((PAT + 1))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Show the plan
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: echo "publishing $TAG"

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            run-build: npm run fetch-model && npx electron-builder --mac --publish never -c.extraMetadata.version=$VERSION && npm run fix-update-metadata
          - os: windows-latest
            platform: win
            run-build: npx electron-builder --win --publish never -c.extraMetadata.version=$VERSION
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Whisper weights
        uses: actions/cache@v4
        with:
          path: build/models
          key: whisper-${{ runner.os }}-${{ hashFiles('scripts/fetch-model.mjs', 'src/main/stt-model.js') }}
      - name: Build ${{ matrix.platform }} installers
        run: ${{ matrix.run-build }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error

  publish:
    # always(): a Windows-only failure (or the other way round) still ships the
    # platform that built. The steps below decide from what actually landed.
    needs: [prepare, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Collect the build outputs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false
      - name: Verify the feed names this version
        id: verify
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for f in dist/dist-win/latest.yml dist/dist-mac/latest-mac.yml; do
            if [ -f "$f" ] && ! grep -q "^version: $VERSION$" "$f"; then
              echo "feed $f does not name $VERSION:"; cat "$f"; exit 1
            fi
          done
      - name: Publish the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "no version was computed; nothing to publish"
            exit 0
          fi
          ASSETS=()
          for pattern in \
            "dist/dist-win/"*.exe \
            "dist/dist-win/"*.exe.blockmap \
            "dist/dist-win/latest.yml" \
            "dist/dist-mac/"*.dmg \
            "dist/dist-mac/"*.zip \
            "dist/dist-mac/latest-mac.yml"; do
            for f in $pattern; do
              if [ -f "$f" ]; then ASSETS+=("$f"); fi
            done
          done
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "no installers were built; nothing to publish"
            exit 0
          fi
          # The tag is fresh by construction (latest tag + 1 patch), but a
          # re-run that lands on an existing one replaces it in place.
          if gh release view "$TAG" --repo MOT1209/KingAgent >/dev/null 2>&1; then
            gh release delete "$TAG" --repo MOT1209/KingAgent --yes --cleanup-tag
          fi
          gh release create \
            --repo MOT1209/KingAgent \
            "$TAG" \
            --title "KingAgent $VERSION" \
            --notes "Rolling build from the latest push to main. Windows and macOS installers; the newest release is what the app offers as its update." \
            "${ASSETS[@]}"
        shell: bash