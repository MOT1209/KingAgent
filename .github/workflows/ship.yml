name: ship

# A rolling release on every push to main, so the last thing anyone pushed is
# always downloadable and installed copies of KingAgent can update to it.
#
# Jobs:
#
#   prepare  computes the next version as latest-published-patch + 1 and stops
#            there — nothing is committed or pushed back. (Committing the bump
#            first seemed obvious, but the build jobs check out the *triggering*
#            sha, not the bump commit, so the built feed always carried the old
#            version while the tag carried the new one, and no updater ever
#            fired.) Every build is handed the version explicitly:
#            electron-builder -c.extraMetadata.version=$VERSION writes it into
#            the app's package.json and the latest*.yml it emits, so what the
#            tag names is exactly what the updater reads. A plain dotted
#            version, because the built-in updater compares latest.yml with
#            semver and update-check.js compares three parts, and a prerelease
#            suffix would be ordered by neither.
#
#   build    the installers, one job per platform so Windows and macOS build in
#            parallel. `npm test` runs on both legs before packaging — ci.yml
#            gates the same push on ubuntu+windows but never macOS, and the two
#            workflows have no dependency between them, so the gate lives here
#            too rather than being assumed. `publish never` keeps the step
#            honest; uploading is publish's job, after the update metadata has
#            been corrected.
#            Unsigned until credentials are wired up: without Apple secrets the
#            macOS builds are downloadable but Gatekeeper has things to say, and
#            Squirrel.Mac will not swap an unsigned app — the bar still offers
#            the dmg. A step in the mac job defines the CSC_LINK / CSC_KEY_PASSWORD
#            and APPLE_API_* variables only when the secrets exist; until they do,
#            electron-builder can not sign (its auto discovery finds no identity on
#            the runner image). Windows follows the same shape via Azure Trusted
#            Signing (see docs/windows-signing.md): the build step below only
#            appends `-c.win.azureSignOptions.*` — and only for the win leg of the
#            matrix — when AZURE_CLIENT_ID is set; without it, the win leg falls
#            through to the same unsigned command as before. The build step runs
#            under bash even on the Windows runner, so the same $VERSION reads an
#            environment variable on both shells (pwsh would demand $env:VERSION).
#
# Secrets this workflow can use, all optional (a build stays unsigned without them):
#   CSC_LINK, CSC_KEY_PASSWORD                                     ) macOS signing
#   APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER              ) + notarization
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET          ) Windows signing
#   AZURE_ENDPOINT, AZURE_CODE_SIGNING_ACCOUNT, AZURE_CERT_PROFILE ) (Trusted Signing)
#
#   publish  releases what landed as a non-prerelease release under the
#            computed tag — after verifying a complete, self-consistent set is
#            there: every installer type (win exe set, mac dmg and update zip)
#            with a feed that actually names the version. A half-built release
#            is worse than none: a draft-free, published, incomplete set makes
#            releases/latest point at it, and every installed copy on the
#            platform that failed starts reading 404 where its feed used to be.
#            So publish demands both platforms or fails the run loudly and
#            leaves the previous good release as the latest. Non-prerelease
#            matters twice: GitHub's releases/latest only points at the newest
#            non-prerelease, and electron-updater reads its feed from there.
#
# The manual release.yml flow for signed, tagged stable builds is untouched and
# coexists: ship only ever makes v<dotted> tags one patch above the newest one
# that exists, tags nothing else, and a stable tag (or draft) can land between
# rollings without a fight.

on:
  push:
    branches: [main]
    # Builds settle on code, build resources, tooling and this workflow itself.
    # A docs- or test-only push has nothing new to install and is not worth a
    # full cross-platform build and a release.
    paths:
      - 'src/**'
      - 'build/**'
      - 'electron-builder.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/ship.yml'
  workflow_dispatch:

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute the next version
        id: version
        run: |
          LATEST=$(gh api repos/MOT1209/KingAgent/releases/latest --jq '.tag_name' 2>/dev/null || true)
          BASE=$(node -p "require('./package.json').version")
          if [ -n "$LATEST" ] && [[ "$LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            BASE=${LATEST#v}
          fi
          IFS=. read -r MAJ MIN PAT <<< "$BASE"
          VERSION="$MAJ.$MIN.$((PAT + 1))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Show the plan
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: echo "publishing $TAG"

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            run-build: npm run fetch-model && npx electron-builder --mac --publish never -c.extraMetadata.version=$VERSION && npm run fix-update-metadata
          - os: windows-latest
            platform: win
            run-build: npm run fetch-model && npx electron-builder --win --publish never -c.extraMetadata.version=$VERSION
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure macOS signing env
        # Defining CSC_LINK at all matters — even as an empty string it sends
        # electron-builder down the p12 keystore path and it dies with "not a
        # file" against the project dir, and the runner image has no Developer
        # ID identity for auto discovery to fall back on either. So nothing is
        # written to $GITHUB_ENV unless CSC_LINK actually holds a secret, and
        # the step-scoped variables below never leave this step. With the
        # secret set, electron-builder signs from the p12 and
        # scripts/notarize-dmg.mjs staples every dmg via notarytool; without
        # it the build stays unsigned exactly as before.
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "CSC_LINK=$CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY=$APPLE_API_KEY" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          fi
          if [ -n "$CSC_LINK" ]; then echo "mac signing env: on"; else echo "mac signing env: off (unsigned build)"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ci.yml gates ubuntu+windows on this same push, but never macOS, and
      # the two workflows have no `needs`/`workflow_run` link — ship.yml would
      # otherwise build and publish regardless of whether tests passed
      # anywhere. Run the suite again here, on both legs of this matrix, so
      # a red test can't ship on either platform without depending on a
      # second, unlinked workflow finishing first. The Windows leg duplicates
      # what ci.yml just ran; the macOS leg is the only place these tests run
      # on macOS at all.
      - run: npm test
      - name: Cache Whisper weights
        uses: actions/cache@v4
        with:
          path: build/models
          key: whisper-${{ runner.os }}-${{ hashFiles('scripts/fetch-model.mjs', 'src/main/stt-model.js') }}
      # Windows signing, same dormant-until-secrets shape as the mac step above,
      # but the toggle lives here instead of its own step: Azure Trusted Signing
      # needs its three AZURE_* identity variables in the *same* process that
      # runs electron-builder (it authenticates during the packaging step, not
      # before it), so setting them globally via GITHUB_ENV like the mac secrets
      # would just leak them into later steps for no benefit. AZURE_CLIENT_ID
      # is the presence check, mirroring CSC_LINK's role for mac. publisherName
      # must match the Trusted Signing certificate's subject exactly — see
      # docs/windows-signing.md before changing the legal entity name below.
      - name: Build ${{ matrix.platform }} installers
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          if [ "${{ matrix.platform }}" = "win" ] && [ -n "$AZURE_CLIENT_ID" ]; then
            npm run fetch-model
            npx electron-builder --win --publish never \
              -c.extraMetadata.version=$VERSION \
              -c.win.azureSignOptions.publisherName="Dainami Pte Ltd" \
              -c.win.azureSignOptions.endpoint="$AZURE_ENDPOINT" \
              -c.win.azureSignOptions.codeSigningAccountName="$AZURE_CODE_SIGNING_ACCOUNT" \
              -c.win.azureSignOptions.certificateProfileName="$AZURE_CERT_PROFILE"
          else
            ${{ matrix.run-build }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error

  publish:
    # always(): a build failure still reaches this job, which then reports WHY
    # the set is incomplete instead of silently shipping half an update.
    needs: [prepare, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Collect the build outputs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false
      - name: Verify a complete set, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "no version was computed; nothing to publish"
            exit 0
          fi
          # Every platform feed must be present and must name the version, and
          # the installer it points at must be there. Anything less fails the
          # run so the previous good release stays the latest.
          for f in \
            dist/dist-win/latest.yml \
            "dist/dist-win/KingAgent.exe" \
            "dist/dist-win/KingAgent-x64.exe" \
            "dist/dist-win/KingAgent-arm64.exe" \
            dist/dist-mac/latest-mac.yml \
            dist/dist-mac/KingAgent-x64.dmg \
            dist/dist-mac/KingAgent-arm64.dmg; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          grep -q "^version: $VERSION$" dist/dist-win/latest.yml || { echo "win feed does not name $VERSION"; cat dist/dist-win/latest.yml; exit 1; }
          grep -q "^version: $VERSION$" dist/dist-mac/latest-mac.yml || { echo "mac feed does not name $VERSION"; cat dist/dist-mac/latest-mac.yml; exit 1; }
          ASSETS=()
          for pattern in \
            "dist/dist-win/"*.exe \
            "dist/dist-win/"*.exe.blockmap \
            "dist/dist-win/latest.yml" \
            "dist/dist-mac/"*.dmg \
            "dist/dist-mac/"*.zip \
            "dist/dist-mac/latest-mac.yml"; do
            for f in $pattern; do
              if [ -f "$f" ]; then ASSETS+=("$f"); fi
            done
          done
          # The tag is fresh by construction (latest tag + 1 patch), but a
          # re-run that lands on an existing one replaces it in place.
          if gh release view "$TAG" --repo MOT1209/KingAgent >/dev/null 2>&1; then
            gh release delete "$TAG" --repo MOT1209/KingAgent --yes --cleanup-tag
          fi
          gh release create \
            --repo MOT1209/KingAgent \
            "$TAG" \
            --title "KingAgent $VERSION" \
            --notes "Rolling build from the latest push to main. Windows and macOS installers; the newest release is what the app offers as its update." \
            "${ASSETS[@]}"
        shell: bash